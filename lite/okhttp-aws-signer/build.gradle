/*
 * okhttp-aws-signer 1.0.2 (https://github.com/babbel/okhttp-aws-signer, tag 1.0.2, MIT
 * licence in LICENSE). The SQL plugin depends on com.github.babbel:okhttp-aws-signer:1.0.2,
 * which exists only on jitpack.io, a service that builds GitHub repositories on demand.
 * This build compiles the same three source files and installs the library in the
 * local Maven repository for the SQL build, so the build never needs jitpack.io.
 *
 * Kotlin language and API level stay at 1.9, the Kotlin standard library the SQL
 * plugin ships.
 */
plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.2.0'
  id 'maven-publish'
}

group = 'com.github.babbel'
version = '1.0.2'

repositories {
  mavenCentral()
}

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
    languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
  }
  coreLibrariesVersion = '1.9.10'
}

dependencies {
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
  implementation 'com.squareup.okhttp3:okhttp:3.14.1'
}

publishing {
  publications {
    maven(MavenPublication) {
      artifactId = 'okhttp-aws-signer'
      from components.java
    }
  }
}
