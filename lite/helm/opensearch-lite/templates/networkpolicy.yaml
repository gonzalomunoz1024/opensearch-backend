{{- if .Values.networkPolicy.enabled }}
# OpenSearch Lite has no login: this policy decides who can reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "osl.fullname" . }}
  labels: {{- include "osl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "osl.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The nodes of this install talk to each other.
    - from:
        - podSelector:
            matchLabels: {{- include "osl.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 9300
    {{- /* An empty "from" would admit everyone, so no rule at all when the list is empty. */}}
    {{- with .Values.networkPolicy.allowFrom }}
    # Clients: the REST port only.
    - from: {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9200
    {{- end }}
{{- end }}
