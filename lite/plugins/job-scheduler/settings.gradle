pluginManagement {
    repositories {
        maven { url "https://ci.opensearch.org/maven2/" }
        maven { url "https://ci.opensearch.org/m2/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'opensearch-job-scheduler'

include "spi"
project(":spi").name = rootProject.name + "-spi"

// OpenSearch Lite: the sample extension plugin is removed (it downloads from ci.opensearch.org at configuration time).
startParameter.excludedTaskNames=["publishPluginZipPublicationToStagingRepository"]
